name: Floral Kernel Build with KernelSU

on:
  workflow_dispatch:

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  CLANG_VERSION: 13
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-android-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi- 
  CLANG_TRIPLE: aarch64-linux-gnu-
  BRANCH: lineage-22.2
  DEVICE: floral

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Repository
      uses: actions/checkout@v4
      with:
        repository: kelvintan1101/android_kernel_google_msm-4.14
        path: ${{ env.KERNEL_DIR }}
        ref: ${{ env.BRANCH }}

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          make \
          gcc \
          g++ \
          flex \
          bison \
          libncurses5-dev \
          libssl-dev \
          wget \
          bc \
          curl \
          libelf-dev \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi \
          gcc-arm-linux-gnueabi \
          zip

    - name: Install Clang 13
      run: |
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.0/clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
        tar xf clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
        mv clang+llvm-13.0.0-x86_64-linux-gnu-ubuntu-20.04 clang-13
        echo "${{ github.workspace }}/clang-13/bin" >> $GITHUB_PATH

    - name: Install KernelSU
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

    - name: Prepare Kernel Configuration
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        make ARCH=${{ env.ARCH }} floral_defconfig

    - name: Build Kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        make -j$(nproc) \
     ARCH=${{ env.ARCH }} \
     CC=clang-13 \
     CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
     CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
     CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }}

    - name: Prepare Kernel Modules
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        mkdir -p modules
        make ARCH=${{ env.ARCH }} \
             CC=clang-13 \
             CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
             CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
             INSTALL_MOD_PATH=modules \
             INSTALL_MOD_STRIP=1 \
             modules_install

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: floral-kernel-lineage-22.2
        path: |
          ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz
          ${{ env.KERNEL_DIR }}/arch/arm64/boot/dtbo.img
          ${{ env.KERNEL_DIR }}/modules/lib/modules/*/kernel

    - name: Display Build Information
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        echo "Kernel build completed!"
        ls -l arch/arm64/boot/
        echo "Kernel modules:"
        ls -l modules/lib/modules/
